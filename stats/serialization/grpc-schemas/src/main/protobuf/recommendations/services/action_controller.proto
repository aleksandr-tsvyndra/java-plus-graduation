syntax = "proto3";

package stats.service.collector;

option java_multiple_files = true;
option java_package = "ru.practicum.recommendations.services";

import "google/protobuf/empty.proto";
import "recommendations/messages/user_actions.proto";

service UserActionController {

  rpc CollectUserAction (user_actions.UserActionProto)
      returns (google.protobuf.Empty);
}