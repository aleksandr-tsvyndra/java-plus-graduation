syntax = "proto3";

package user_actions;

option java_multiple_files = true;
option java_package = "ru.practicum.recommendations.messages";
import "google/protobuf/timestamp.proto";

// Типы действий пользователя
enum ActionTypeProto {
  ACTION_VIEW = 0;
  ACTION_REGISTER = 1;
  ACTION_LIKE = 2;
}

// Действие пользователя, отправляемое в систему рекомендаций
message UserActionProto {
  int64 user_id = 1;
  int64 event_id = 2;
  ActionTypeProto action_type = 3;
  google.protobuf.Timestamp timestamp = 4;
}