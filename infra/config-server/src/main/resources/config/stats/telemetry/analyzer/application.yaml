grpc:
  server:
    port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  datasource:
    dataSourceClassName: org.postgresql.ds.PGSimpleDataSource
    url: jdbc:postgresql://localhost:6432/analytics_db
    username: recomm-analyzer
    password: recomm-analyzer

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: "recomm.analyzer.consumer"
      enable-auto-commit: false

analyzer:
  kafka:
    consumer:
      topics:
        user-actions: "stats.user-actions.v1"
        events-similarity: "stats.events-similarity.v1"