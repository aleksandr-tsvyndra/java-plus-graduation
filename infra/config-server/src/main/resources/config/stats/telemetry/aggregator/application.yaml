aggregator:
  kafka:
    producer:
      properties:
        bootstrap.servers: localhost:9092
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: ru.practicum.avro.serializer.GeneralAvroSerializer
      topics:
        event-similarity-topic: stats.events-similarity.v1
    consumer:
      properties:
        bootstrap.servers: localhost:9092
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.practicum.avro.deserializer.UserActionDeserializer
        client.id: aggregator
        group.id: aggregator-group
        enable.auto.commit: false
      topics:
        user-action-topic: stats.user-actions.v1

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always