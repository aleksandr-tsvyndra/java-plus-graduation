services:
  stats-db:
    image: postgres:16.1
    container_name: stats
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=stats
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345

  main-db:
    image: postgres:16.1
    container_name: main
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=main
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345

  gateway-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: gateway-server
    ports:
      - "8080:8080"
    volumes:
      - ./infra/gateway-server/target/gateway-server-0.0.1-SNAPSHOT.jar:/app.jar
    command: java -jar /app.jar

  stats-server:
    image: eclipse-temurin:21-jdk-alpine
    container_name: stats-server
    ports:
      - "9090:9090"
    volumes:
      - ./stats/stats-server/target/stats-server-0.0.1-SNAPSHOT.jar:/app.jar
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/stats
    command: java -jar /app.jar
    depends_on:
      - stats-db

  user-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: user-service
    ports:
      - "8081:8081"
    volumes:
      - ./core/main-service/target/user-service-0.0.1-SNAPSHOT.jar:/app.jar
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://main-db:5432/main
    command: java -jar /app.jar
    depends_on:
      - main-db

  category-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: category-service
    ports:
      - "8081:8081"
    volumes:
      - ./core/main-service/target/category-service-0.0.1-SNAPSHOT.jar:/app.jar
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://main-db:5432/main
    command: java -jar /app.jar
    depends_on:
      - main-db

  event-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: event-service
    ports:
      - "8081:8081"
    volumes:
      - ./core/main-service/target/event-service-0.0.1-SNAPSHOT.jar:/app.jar
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://main-db:5432/main
    command: java -jar /app.jar
    depends_on:
      - main-db

  request-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: request-service
    ports:
      - "8081:8081"
    volumes:
      - ./core/main-service/target/request-service-0.0.1-SNAPSHOT.jar:/app.jar
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://main-db:5432/main
    command: java -jar /app.jar
    depends_on:
      - main-db

  compilation-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: compilation-service
    ports:
      - "8081:8081"
    volumes:
      - ./core/main-service/target/compilation-service-0.0.1-SNAPSHOT.jar:/app.jar
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://main-db:5432/main
    command: java -jar /app.jar
    depends_on:
      - main-db

  review-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: review-service
    ports:
      - "8081:8081"
    volumes:
      - ./core/main-service/target/review-service-0.0.1-SNAPSHOT.jar:/app.jar
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://main-db:5432/main
    command: java -jar /app.jar
    depends_on:
      - main-db

  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true